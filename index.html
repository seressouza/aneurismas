<style>
:root{
  --navy:#5A0F22; --navy2:#7A1830; --cream:#F6F3EC; --paper:#FFFDF8; --ink:#14213D;
  --muted:#5C6870; --line:#E2DCCD; --rust:#B5172E; --coral:#E0485A; --cyan:#F4B942; --blue:#0E6E78;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:var(--cream);padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:10}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top .back{background:none;border:0;color:var(--cream);font-size:22px;padding:4px 8px 4px 0;cursor:pointer;line-height:1}
header.top .title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .prog{font-size:13px;color:#F1D6DA;white-space:nowrap}
.hero{background:var(--navy);color:var(--cream);padding:8px 0 28px}
.hero h1{font-size:30px;line-height:1.12;margin:6px 0 10px;letter-spacing:-.01em}
.hero p{color:#F1D6DA;margin:0 0 14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F4B942}
.ecg{display:block;width:100%;height:46px;margin:8px 0 4px}
.ecg path{stroke:var(--cyan);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:8px;transition:width .4s}
.barlabel{font-size:13px;color:#F1D6DA;margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:12px;border:0;background:var(--coral);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,243,236,.5)}
.btn.light{background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.btn.small{min-height:40px;font-size:14px;padding:8px 12px}
main{padding:18px 0 calc(40px + env(safe-area-inset-bottom))}
h2{font-size:22px;line-height:1.2;margin:22px 0 10px;color:var(--navy)}
h3{font-size:18px;line-height:1.25;margin:0 0 8px;color:var(--navy)}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail:before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:3px;background:var(--line);border-radius:3px}
.station{position:relative;display:flex;gap:14px;align-items:stretch;margin:0 0 12px;text-decoration:none;color:inherit}
.dot{flex:0 0 48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);z-index:1;font-size:17px}
.station.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.station.started .dot{border-color:var(--coral)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;flex:1}
.station .card h3{margin:0 0 2px;font-size:17px}
.station .card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;background:#E2F2F3;color:var(--blue);border-radius:20px;padding:2px 9px}
.chip.q{background:var(--badbg);color:var(--rust)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.block p{margin:0 0 10px}.block p:last-child{margin-bottom:0}
.block ul{margin:0 0 10px;padding-left:20px}.block li{margin-bottom:5px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin-bottom:6px;display:block}
.kicker.blue{color:var(--blue)}
.note{background:var(--warnbg);border:1px solid #EBC774;border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.quote{font-style:italic;font-size:18px;color:var(--navy);border-left:4px solid var(--coral);padding:4px 0 4px 14px;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 6px}
th{background:var(--navy);color:var(--cream);text-align:left;padding:8px;font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;margin:0 -4px}
label{display:block;font-size:14px;font-weight:600;color:var(--navy);margin:10px 0 4px}
input[type=number],select{width:100%;min-height:46px;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid rgba(14,110,120,.35);border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{margin-top:12px;background:var(--navy);color:var(--cream);border-radius:12px;padding:14px}
.out .big{font-size:28px;font-weight:800;line-height:1.1;color:#fff}
.out .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#E8B4BC}
.out p{margin:6px 0 0;color:#F1D6DA;font-size:14px}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.seg button{flex:1 1 auto;min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left}
.seg button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:48px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#173F22}
.fb.bad{background:var(--badbg);color:#5A1E05}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.qtext{font-weight:700;font-size:17px;color:var(--navy)}
.sortitem{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:#fff}
.sortitem .seg button{flex:1 1 30%;text-align:center;font-size:13px;min-height:40px;padding:6px}
.sortitem.right{border-color:var(--ok);background:var(--okbg)}
.sortitem.wrong{border-color:var(--bad);background:var(--badbg)}
.links a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.links a:last-child{border-bottom:0}
.links a span.s{font-size:13px;color:var(--muted)}
.links a b{color:var(--navy);font-weight:600}
.net{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.badge{text-align:center;padding:22px 16px}
.badge .medal{font-size:54px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.small{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);padding:10px 0 30px;text-align:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
@media (max-width:380px){.hero h1{font-size:26px}.actions{grid-template-columns:1fr}.outgrid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.dir{background:#E2F2F3;color:#0E6E78}.tag.ens{background:#EDE7F6;color:#5B3A9A}.tag.pra{background:#FFF1D6;color:#8A5A00}.tag.lac{background:#FDE3E6;color:#B5172E}
.out.alert{background:linear-gradient(135deg,#B5172E,#5A0F22)}
.aorta{display:block;width:100%;height:70px;margin:10px 0 4px}
.aorta path{stroke:var(--cyan);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s ease-out forwards}
.aorta .sac{fill:rgba(224,72,90,.35);stroke:none;transform-origin:300px 35px;animation:pulse 1.1s ease-in-out 2.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.aorta path{animation:none;stroke-dashoffset:0}.aorta .sac{animation:none}}
.station:nth-child(8n+1) .card{border-left:5px solid #E0485A}.station:nth-child(8n+2) .card{border-left:5px solid #F4B942}
.trail li:nth-child(1) .card{border-left:5px solid #E0485A}.trail li:nth-child(2) .card{border-left:5px solid #F4B942}.trail li:nth-child(3) .card{border-left:5px solid #B5172E}
.trail li:nth-child(4) .card{border-left:5px solid #0E6E78}.trail li:nth-child(5) .card{border-left:5px solid #5B3A9A}.trail li:nth-child(6) .card{border-left:5px solid #2E86AB}
.trail li:nth-child(7) .card{border-left:5px solid #3A7D44}.trail li:nth-child(8) .card{border-left:5px solid #D9822B}.trail li:nth-child(9) .card{border-left:5px solid #5A0F22}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
</style>

<script>
"use strict";
/* ====================== Armazenamento seguro ====================== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let progress = store.get("trilha-aaa-v1", {});
function saveProgress(){ store.set("trilha-aaa-v1", progress); }
/* ====================== Conteúdo ====================== */
const MODULES = [
{
  id:"m1", n:1, title:"Definição e risco", sub:"O que é o AAA, em quem aparece e como evolui",
  blocks:[
    {t:"html", html:`<span class="kicker">Em uma frase</span>
      <div class="quote">AAA é a aorta abdominal com 3,0 cm ou mais: quase sempre silencioso, cresce devagar e acelera à medida que aumenta.</div>
      <ul>
        <li><b>Definição:</b> diâmetro da aorta abdominal ≥ <b>3,0 cm</b>, medido por ultrassonografia. <span class="tag dir">Diretriz</span></li>
        <li><b>Localização mais comum:</b> infrarrenal, abaixo das artérias renais. <span class="tag dir">Diretriz</span></li>
        <li>A maioria é <b>assintomática até romper</b>; após a rotura, a mortalidade chega a cerca de <b>81%</b>. <span class="tag dir">Diretriz</span></li>
      </ul>`},
    {t:"html", html:`<span class="kicker">Fatores de risco</span>
      <ul>
        <li><b>Principais:</b> idade avançada, sexo masculino, tabagismo, parente de 1º grau com AAA.</li>
        <li><b>Outros:</b> outros aneurismas, doença coronariana ou cerebrovascular, aterosclerose, hipercolesterolemia, hipertensão.</li>
        <li><b>Tabagismo</b> é o fator <b>modificável</b> mais forte.</li>
        <li>Curiosidade que cai em prova: <b>diabetes</b> está associado a <b>menor</b> risco de AAA.</li>
      </ul>
      <p class="small">Fonte: USPSTF 2019. <span class="tag dir">Diretriz</span></p>`},
    {t:"sort", id:"risco"},
    {t:"html", html:`<span class="kicker">História natural: quanto cresce por ano</span>
      <div class="tablewrap"><table>
        <tr><th>Diâmetro inicial</th><th>Crescimento médio</th></tr>
        <tr><td>30–40 mm</td><td>~0,8 mm/ano</td></tr>
        <tr><td>40–50 mm</td><td>~1,2 mm/ano</td></tr>
        <tr><td>≥ 50 mm</td><td>~4,1 mm/ano</td></tr>
      </table></div>
      <p class="small">Coorte espanhola, J Clin Med 2025. <span class="tag ens">Ensaio/coorte</span> Quanto maior o aneurisma, mais rápido cresce, por isso a vigilância encurta.</p>
      <p><b>Fatores de risco para rotura:</b> maior diâmetro, crescimento rápido, sexo feminino, idade mais avançada, tabagismo ativo.</p>`},
    {t:"html", html:`<span class="kicker">Armadilha clínica</span><p>O diagnóstico costuma ser achado de exame feito por outro motivo. <b>Sem sintoma não significa sem risco.</b></p>`},
  ],
  quiz:[
    {q:"O critério diagnóstico do AAA é um diâmetro da aorta abdominal de:", o:["≥ 2,0 cm","≥ 2,5 cm","≥ 3,0 cm","≥ 5,5 cm"], a:2, e:"AAA = aorta abdominal ≥ 3,0 cm. 5,5 cm é o limiar cirúrgico em homens, não o diagnóstico."},
    {q:"Qual é o principal fator de risco modificável para AAA?", o:["Diabetes","Tabagismo","Sexo masculino","História familiar"], a:1, e:"Tabagismo. Sexo e história familiar não são modificáveis, e o diabetes está associado a menor risco."},
    {q:"Em relação à história natural do AAA, é correto afirmar:", o:["Cresce sempre na mesma velocidade","Cresce mais rápido quanto maior o diâmetro","Para de crescer após os 4 cm","Diminui com exercício resistido"], a:1, e:"O crescimento acelera com o diâmetro: ~0,8 mm/ano entre 30–40 mm e ~4,1 mm/ano acima de 50 mm."}
  ]
},
{
  id:"m2", n:2, title:"Rastreamento e cirurgia", sub:"Quem rastrear, quando vigiar e quando operar",
  blocks:[
    {t:"html", html:`<span class="kicker">Em uma frase</span>
      <div class="quote">Rastreia-se com ultrassom quem tem alto risco; opera-se o AAA assintomático a partir de 5,5 cm em homens e 5,0 cm em mulheres.</div>`},
    {t:"html", html:`<span class="kicker">Rastreamento</span>
      <ul>
        <li><b>Exame:</b> ultrassonografia abdominal. A ESVS 2024 baseia a decisão cirúrgica na medida do ultrassom; a angiotomografia serve para planejar o tratamento.</li>
        <li><b>ESVS 2024:</b> rastrear apenas <b>populações de alto risco</b> (classe I, nível A). Deixou de recomendar para todos os homens de 65 anos porque a prevalência caiu para menos de 1% em vários países.</li>
        <li><b>USPSTF 2019:</b> ultrassom único em homens de 65 a 75 anos que <b>já fumaram</b> (grau B). Não rastrear rotineiramente mulheres que nunca fumaram e sem história familiar (grau D).</li>
      </ul>`},
    {t:"html", html:`<span class="kicker">Quando operar</span>
      <div class="tablewrap"><table>
        <tr><th>Situação</th><th>Conduta</th></tr>
        <tr><td>Homem, assintomático, ≥ 5,5 cm</td><td>Considerar correção eletiva</td></tr>
        <tr><td>Mulher, assintomática, ≥ 5,0 cm</td><td>Considerar correção eletiva</td></tr>
        <tr><td>Abaixo desses limiares</td><td><b>Não</b> operar (ESVS 2024, classe III): vigiar</td></tr>
        <tr><td>Crescimento rápido</td><td>Encaminhar para avaliação</td></tr>
        <tr><td>Sintomático</td><td>Urgência</td></tr>
        <tr><td>Rotura</td><td>Emergência</td></tr>
      </table></div>`},
    {t:"calc", id:"aaa"},
    {t:"html", html:`<span class="kicker">Armadilha clínica</span><p>A regra do rastreamento <b>não vale para quem tem sintoma</b>. Dor abdominal ou lombar em paciente de risco exige avaliação imediata, em qualquer idade.</p>`},
  ],
  quiz:[
    {q:"Segundo a ESVS 2024, o rastreamento de AAA é recomendado para:", o:["Toda a população acima de 50 anos","Todos os homens de 65 anos, sem exceção","Populações de alto risco","Apenas mulheres fumantes"], a:2, e:"A ESVS 2024 restringiu o rastreamento a populações de alto risco (classe I, nível A)."},
    {q:"O limiar de correção eletiva do AAA assintomático é:", o:["5,0 cm em homens e 4,5 cm em mulheres","5,5 cm em homens e 5,0 cm em mulheres","6,0 cm em ambos os sexos","4,5 cm em ambos os sexos"], a:1, e:"5,5 cm em homens e 5,0 cm em mulheres. Mulheres têm maior risco de rotura para o mesmo diâmetro."},
    {q:"Homem de 70 anos com AAA de 3,4 cm. Quando repetir o ultrassom (ACC/AHA 2022)?", o:["Em 6 meses","Em 1 ano","Em 3 anos","Não precisa de vigilância"], a:2, e:"3,0–3,9 cm: a cada 3 anos."}
  ]
},
{
  id:"m3", n:3, title:"Rotura", sub:"Reconhecer em 30 segundos e agir",
  blocks:[
    {t:"html", html:`<span class="kicker">Em uma frase</span>
      <div class="quote">Dor abdominal ou lombar súbita, hipotensão e massa pulsátil: o fisioterapeuta para tudo e aciona a equipe.</div>
      <span class="kicker">Tríade clássica</span>
      <ol class="steps"><li>Dor abdominal, lombar ou no flanco, <b>súbita e intensa</b></li><li><b>Hipotensão</b> ou choque</li><li><b>Massa abdominal pulsátil</b></li></ol>
      <p>A tríade completa aparece numa minoria dos casos: <b>dois elementos em paciente de risco já bastam para suspeitar</b>. <span class="tag pra">Prática</span></p>
      <p>No hospital, a conduta inclui <b>hipotensão permissiva</b> e correção de emergência. <span class="tag dir">Diretriz</span></p>`},
    {t:"html", html:`<span class="kicker">Diagnósticos que confundem</span>
      <div class="chips"><span class="chip">Cólica renal</span><span class="chip">Lombalgia mecânica</span><span class="chip">Diverticulite</span><span class="chip">Infarto agudo do miocárdio</span></div>`},
    {t:"sort", id:"rotura"},
    {t:"html", html:`<span class="kicker">Armadilha clínica</span><p>"Lombalgia nova e forte" em idoso tabagista ou com AAA conhecido <b>nunca é caso de terapia manual</b> antes de excluir rotura.</p>`},
  ],
  quiz:[
    {q:"A tríade clássica da rotura do AAA é:", o:["Febre, dor abdominal e icterícia","Dor abdominal ou lombar súbita, hipotensão e massa pulsátil","Claudicação, palidez e ausência de pulsos","Dispneia, dor torácica e síncope"], a:1, e:"Dor súbita, hipotensão e massa pulsátil. Claudicação, palidez e ausência de pulsos descrevem isquemia de membro."},
    {q:"Diante de suspeita de rotura durante o atendimento, o fisioterapeuta deve:", o:["Sentar o paciente para aliviar a dor","Concluir a sessão e registrar","Interromper, deitar, não mobilizar e acionar a equipe","Aplicar calor e reavaliar em 15 minutos"], a:2, e:"Rotura é emergência com mortalidade de até ~81%: não mobilizar e acionar a equipe imediatamente."},
    {q:"Qual diagnóstico diferencial mais engana o fisioterapeuta?", o:["Lombalgia mecânica","Entorse de tornozelo","Tendinite do ombro","Fascite plantar"], a:0, e:"Dor lombar é queixa comum na fisioterapia. Hipotensão e taquicardia associadas apontam para choque, não para lombalgia mecânica."}
  ]
},
{
  id:"m4", n:4, title:"AAA não corrigido", sub:"Cuidados, restrições e exercício resistido",
  blocks:[
    {t:"html", html:`<span class="kicker">Em uma frase</span>
      <div class="quote">A diretriz não manda restringir exercício no AAA pequeno: o que se controla é a pressão arterial e a Valsalva, não um número de quilos.</div>
      <ul>
        <li><b>ESVS 2024:</b> restringir exercício ou atividade sexual no AAA pequeno <b>não é indicado</b>. <span class="tag dir">Diretriz</span></li>
        <li><b>Revisão 2024:</b> em AAA até 5,5 cm, o exercício é seguro e melhora a capacidade funcional; só quatro ensaios incluíram resistido.</li>

/* ====================== Utilitários ====================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : NaN; };
const fmt = (n, d=0) => n.toLocaleString("pt-BR", {minimumFractionDigits:d, maximumFractionDigits:d});
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
function doneCount(){ return MODULES.filter(m => progress[m.id] && progress[m.id].quiz).length; }

/* ====================== Calculadoras ====================== */
const CALCS = {
  aaa: {
    title:"Simulador: o que fazer com este aneurisma?",
    html:`<p>Coloque os dados do paciente e veja a conduta segundo as diretrizes.</p>
      <label>Sexo</label>
      <div class="seg" id="aSex"><button data-v="M" aria-pressed="true">Homem</button><button data-v="F" aria-pressed="false">Mulher</button></div>
      <div class="row2"><div><label for="aDiam">Diâmetro (cm)</label><input id="aDiam" type="number" inputmode="decimal" step="0.1" value="4.6"></div>
      <div><label for="aGrow">Cresceu em 1 ano (cm)</label><input id="aGrow" type="number" inputmode="decimal" step="0.1" value="0.2"></div></div>
      <label>Tem dor abdominal ou lombar atribuída ao aneurisma?</label>
      <div class="seg" id="aSym"><button data-v="0" aria-pressed="true">Não</button><button data-v="1" aria-pressed="false">Sim</button></div>
      <div id="aOut"></div>
      <p class="small" style="margin-top:8px">Limiares: ESVS 2024. Intervalos de vigilância: ACC/AHA 2022. Ferramenta didática: a decisão real é da equipe vascular.</p>`,
    init(root){
      let sex="M", sym=0;
      const segs=(id,cb)=>root.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener("click",()=>{
        root.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true"); cb(b.dataset.v); run();
      }));
      segs("aSex",v=>sex=v); segs("aSym",v=>sym=+v);
      const run=()=>{
        const d=num($("#aDiam",root).value), g=num($("#aGrow",root).value);
        if(!(d>0)){ $("#aOut",root).innerHTML=""; return; }
        const lim = sex==="M"?5.5:5.0;
        let big, lbl, txt, tone="";
        if(d<3.0){
          lbl="Classificação"; big="Não é AAA";
          txt = d>=2.5 ? "Entre 2,5 e 2,9 cm a aorta é considerada subaneurismática: a ESVS 2024 passou a incluir esses pacientes na vigilância, porque parte deles chega a AAA em poucos anos." : "Abaixo de 3,0 cm não há aneurisma.";
          if(sym) txt += " A dor precisa de investigação: não é explicada por AAA.";
        } else if(sym){
          lbl="Conduta"; big="Urgência"; tone="alert";
          txt="AAA sintomático é urgência cirúrgica. Se houver hipotensão ou choque, pense em rotura: emergência.";
        } else if(d>=lim){
          lbl="Conduta"; big="Limiar atingido"; tone="alert";
          txt=`Com ${fmt(d,1)} cm, atingiu o limiar de ${fmt(lim,1)} cm para ${sex==="M"?"homens":"mulheres"}: considerar correção eletiva (aberta ou EVAR). Pré-habilitação ajuda: complicações caíram de 41,9% para 22,6% no ensaio de Barakat.`;
        } else if(g>=1.0){
          lbl="Conduta"; big="Crescimento rápido"; tone="alert";
          txt="Crescimento de cerca de 1 cm ou mais no ano: encaminhar para avaliação de correção, após confirmar a medida.";
        } else {
          let iv;
          if(d<4.0) iv="a cada 3 anos";
          else if((sex==="M"&&d<5.0)||(sex==="F"&&d<4.5)) iv="uma vez por ano";
          else iv="a cada 6 meses";
          lbl="Conduta"; big="Vigiar";
          txt=`Abaixo do limiar de ${fmt(lim,1)} cm: não operar (ESVS 2024, classe III). Repetir o ultrassom <b style="color:#fff">${iv}</b>. Exercício liberado com prescrição: aeróbio moderado e resistido leve a moderado, sem Valsalva. Parar de fumar e controlar a PA.`;
        }
        $("#aOut",root).innerHTML=`<div class="out ${tone}"><div class="lbl">${lbl}</div><div class="big">${big}</div><p>${txt}</p></div>`;
      };
      root.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();

      };
      root.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
    }
  }
};

  progress[m.id] = Object.assign({}, progress[m.id], {visited:true}); saveProgress();
  const idx = MODULES.indexOf(m);
  let html = header(`${m.n}. ${m.title}`, true) + `<main><div class="wrap"><h2 style="margin-top:6px">${esc(m.title)}</h2><p class="small" style="margin-top:-4px">${esc(m.sub)}</p>`;
  m.blocks.forEach((b,i)=>{
    if(b.t==="html") html += `<div class="block">${b.html}</div>`;
    if(b.t==="calc") html += `<div class="block" data-calc="${b.id}"><span class="kicker blue">Demonstração</span><h3>${CALCS[b.id].title}</h3>${CALCS[b.id].html}</div>`;
    if(b.t==="links") html += `<div class="block links"><span class="kicker blue">Links diretos</span>${b.items.map(l=>`<a href="${l.u}" target="_blank" rel="noopener"><span><b>${esc(l.t)}</b><br><span class="s">${esc(l.s)}</span></span><span class="net">internet</span></a>`).join("")}</div>`;

  });

  html += `<div class="navbtns">${idx>0?`<a class="btn light small" href="#/m/${MODULES[idx-1].id}">‹ ${esc(MODULES[idx-1].title)}</a>`:`<a class="btn light small" href="#/">‹ Início</a>`}${idx<MODULES.length-1?`<a class="btn small" href="#/m/${MODULES[idx+1].id}">${esc(MODULES[idx+1].title)} ›</a>`:`<a class="btn small" href="#/">Concluir ›</a>`}</div>`;

function mountSort(el, s){
  const choice = s.items.map(()=>null);
  el.innerHTML = `<span class="kicker blue">Demonstração</span><h3>${s.title}</h3><p>${s.intro}</p>` +
    s.items.map((it,i)=>`<div class="sortitem" data-i="${i}"><div>${esc(it[0])}</div><div class="seg">${s.cats.map((c,j)=>`<button data-j="${j}" aria-pressed="false">${c}</button>`).join("")}</div></div>`).join("") +
    `<button class="btn" style="width:100%;margin-top:6px" id="sortCheck">Conferir</button><div id="sortRes" style="margin-top:10px"></div><p class="small" style="margin-top:8px">${s.foot}</p>`;
  el.querySelectorAll(".sortitem").forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      row.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); choice[i]=+b.dataset.j; row.classList.remove("right","wrong");
    }));
  });
  $("#sortCheck",el).addEventListener("click",()=>{
    if(choice.some(c=>c===null)){ toast("Classifique todas as situações"); return; }
    let ok=0;
    el.querySelectorAll(".sortitem").forEach(row=>{ const i=+row.dataset.i; const r=choice[i]===s.items[i][1]; if(r) ok++; row.classList.toggle("right",r); row.classList.toggle("wrong",!r);
      if(!r && !row.querySelector(".fix")){ const f=document.createElement("div"); f.className="small fix"; f.textContent="Resposta: "+s.cats[s.items[i][1]]; row.appendChild(f);} });
    $("#sortRes",el).innerHTML=`<div class="fb ${ok===s.items.length?"ok":"bad"}"><b>${ok} de ${s.items.length} certas.</b> ${ok===s.items.length?s.ok:"Revise as marcadas em vermelho."}</div>`;
  });
}

function mountScenario(el, s){
  el.innerHTML = `<span class="kicker blue">Demonstração · decisão clínica</span><h3>${s.title}</h3><p>${s.lead}</p><div class="opts">${s.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join("")}</div><div class="scfb"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const o=s.opts[+b.dataset.i];
    el.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
    b.classList.add(o[1]?"right":"wrong");
    $(".scfb",el).innerHTML=`<div class="fb ${o[1]?"ok":"bad"}">${o[2]}</div>`;
  }));
}

function mountQuiz(el, m){
  let i=0, score=0;
  const prev = progress[m.id] && progress[m.id].quiz;
  function intro(){
    el.innerHTML = `<span class="kicker">Quiz da estação</span><h3>${m.quiz.length} perguntas</h3>${prev?`<p>Seu último resultado: <b>${prev.score}/${prev.total}</b>.</p>`:"<p>Teste o que ficou desta estação.</p>"}<button class="btn" style="width:100%" id="qStart">${prev?"Refazer o quiz":"Começar o quiz"}</button>`;
    $("#qStart",el).addEventListener("click",()=>{ i=0; score=0; show(); });
  }
  function show(){
    const q=m.quiz[i];
    el.innerHTML = `<div class="qhead"><span>Pergunta ${i+1} de ${m.quiz.length}</span><span>${score} acerto${score===1?"":"s"}</span></div>
      <div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="qfb"></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const j=+b.dataset.j, r=j===q.a; if(r) score++;
      el.querySelectorAll(".opt").forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("right"); });
      if(!r) b.classList.add("wrong");
      $(".qfb",el).innerHTML=`<div class="fb ${r?"ok":"bad"}"><b>${r?"Isso.":"Não exatamente."}</b> ${esc(q.e)}</div>
        <button class="btn" style="width:100%;margin-top:10px" id="qNext">${i<m.quiz.length-1?"Próxima":"Ver resultado"}</button>`;
      $("#qNext",el).addEventListener("click",()=>{ i++; if(i<m.quiz.length) show(); else finish(); });
      $("#qNext",el).focus({preventScroll:true});
    }));
  }
  function finish(){
    progress[m.id] = Object.assign({}, progress[m.id], {quiz:{score, total:m.quiz.length}}); saveProgress();
    const all = doneCount()===MODULES.length;
    el.innerHTML = `<div class="badge"><div class="medal" aria-hidden="true">${score===m.quiz.length?"🏅":"✓"}</div><h3>${score} de ${m.quiz.length}</h3><p>${score===m.quiz.length?"Estação dominada.":"Estação concluída. Releia os pontos que errou e refaça quando quiser."}</p>${all?"<p><b>Você completou a trilha inteira!</b></p>":""}<button class="btn light" style="width:100%" id="qAgain">Refazer</button></div>`;
    $("#qAgain",el).addEventListener("click",()=>{ i=0; score=0; show(); });
    const t=$(".top .prog"); if(t) t.textContent=`${doneCount()}/${MODULES.length} estações`;
  }
  intro();
}

  <div class="block"><span class="kicker">Funciona sem internet</span>
    <p>Depois que você abre esta página uma vez com internet, a trilha, os simuladores, os jogos e os quizzes ficam guardados no seu celular e funcionam offline.</p>
    <p class="small">Só os links das diretrizes e artigos precisam de conexão.</p></div>
  <div class="block"><span class="kicker">Instale na tela inicial</span>
    ${ios?`<ol class="steps"><li>No Safari, toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>`:
    `<ol class="steps"><li>No Chrome, toque nos <b>três pontinhos</b>.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme.</li></ol>`}
    <button class="btn" style="width:100%;display:none" id="installBtn">Instalar agora</button></div>
  <div class="block"><span class="kicker">Seu progresso</span><p>Fica salvo só neste aparelho.</p><button class="btn light" style="width:100%" id="resetBtn">Recomeçar a trilha</button></div>
  <a class="btn light" href="#/">‹ Voltar à trilha</a></div></main>`;
  if(deferredPrompt){ const b=$("#installBtn"); b.style.display="flex"; b.addEventListener("click", async()=>{ deferredPrompt.prompt(); deferredPrompt=null; b.style.display="none"; }); }
  $("#resetBtn").addEventListener("click",()=>{ progress={}; saveProgress(); toast("Progresso apagado"); });
  window.scrollTo(0,0);
}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });

function route(){
  const h = location.hash || "#/";
  if(h.startsWith("#/m/")) return renderModule(h.slice(4));
  if(h==="#/refs") return renderRefs();
  if(h==="#/sobre") return renderAbout();
  renderHome();
}
window.addEventListener("hashchange", route);
route();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
